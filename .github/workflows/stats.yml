name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write   # required to commit generated SVGs back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stats generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Check for changes
        id: changes
        run: |
          git add assets/stats*.svg assets/top-languages*.svg assets/streak*.svg
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated SVGs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated stats SVGs"
          git push origin main